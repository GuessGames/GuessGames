<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="GuessGames banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="55%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14">
        <animate attributeName="stop-color" values="#39FF14;#00E5FF;#FFB000;#39FF14" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#FFB000;#39FF14;#00E5FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFB000">
        <animate attributeName="stop-color" values="#FFB000;#39FF14;#00E5FF;#FFB000" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C2A3A" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- floating orbs -->
  <circle cx="180" cy="80" r="46" fill="#39FF14" opacity="0.08">
    <animate attributeName="cy" values="80;110;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="220" r="70" fill="#00E5FF" opacity="0.08">
    <animate attributeName="cy" values="220;180;220" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="70" r="36" fill="#FFB000" opacity="0.08">
    <animate attributeName="cx" values="700;740;700" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- scan line -->
  <rect x="0" y="-40" width="1200" height="40" fill="url(#scan)">
    <animate attributeName="y" values="-40;320;-40" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- brand -->
  <g filter="url(#glow)">
    <text x="80" y="128" fill="#E8F1F8" font-family="Segoe UI, Consolas, monospace" font-size="64" font-weight="700" letter-spacing="2">
      GUESSGAMES
    </text>
    <rect x="80" y="148" width="0" height="3" fill="url(#accent)">
      <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.35;0.75;1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="80" y="198" fill="#8FA3B8" font-family="Segoe UI, Consolas, monospace" font-size="22" letter-spacing="1.5">
    Multiplayer systems · Game mods · Coop experiences
  </text>

  <!-- status chip -->
  <g transform="translate(80, 230)">
    <rect width="260" height="36" rx="8" fill="#121C28" stroke="#243447"/>
    <circle cx="22" cy="18" r="6" fill="#39FF14">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="23" fill="#C7D6E4" font-family="Segoe UI, Consolas, monospace" font-size="14">
      BUILDING THE NEXT ROUND
    </text>
  </g>

  <!-- corner brackets -->
  <path d="M40 40 H90 V45 H45 V90 H40 Z" fill="#39FF14" opacity="0.7"/>
  <path d="M1160 40 H1110 V45 H1155 V90 H1160 Z" fill="#00E5FF" opacity="0.7"/>
  <path d="M40 280 H90 V275 H45 V230 H40 Z" fill="#00E5FF" opacity="0.7"/>
  <path d="M1160 280 H1110 V275 H1155 V230 H1160 Z" fill="#FFB000" opacity="0.7"/>

  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
</svg>
